[project]
name = "polynodes-osc-mcp"
version = "0.2.0"
description = "MCP Server for controlling PolyNodes via OSC"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.26.0,<2",
    "python-osc",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "osc_registry.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
